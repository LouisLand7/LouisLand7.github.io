<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千秩 - 资源访问平台</title>
    <link rel="stylesheet" href="./styles/public.css">
    <style>
        /* 简易内置样式，排版美化，可迁移到public.css */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            font-family: "Microsoft Yahei", sans-serif;
        }
        /* 标题区域 */
        #title {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 25px;
            border-bottom: 2px solid #666;
        }
        #title h1 span {
            color: #2563eb;
            font-weight: bold;
        }
        /* 导航快捷栏 */
        .nav-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .nav-bar a {
            padding: 8px 16px;
            background: #eef2ff;
            border-radius: 6px;
            text-decoration: none;
            color: #2563eb;
        }
        .nav-bar a:hover {
            background: #2563eb;
            color: #fff;
        }
        /* 通用模块样式 */
        section {
            margin: 40px 0;
        }
        section h2 {
            padding-bottom: 10px;
            border-bottom: 1px solid #aaa;
            margin-bottom: 20px;
            color: #222;
        }
        /* 链接图片容器，自动流式排版 */
        .link-box {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }
        .link-box a img {
            width: 320px;
            max-width: 100%;
            border-radius: 4px;
            transition: 0.2s;
        }
        .link-box a img:hover {
            transform: scale(1.03);
        }
        /* 文字链接样式 */
        .text-link {
            margin-top: 10px;
        }
        .text-link a {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <!-- 顶部标题区域 -->
    <div id="title">
        <h1>欢迎来到<span>千秩</span>资源访问平台!<br>不定期更新~</h1>
    </div>

    <!-- 模块快速导航 -->
    <div class="nav-bar">
        <a href="#school">校内网页连接</a>
        <a href="#cs">计算机科学</a>
        <a href="#mech">机械工程</a>
        <a href="#elec">电子技术</a>
        <a href="#practical">实用技术</a>
    </div>

    <!-- 模块1：校内网页连接 -->
    <section id="school">
        <h2>一、校内网页连接</h2>
        <div class="link-box">
            <a href="http://course.buct.edu.cn/" target="_blank">
                <img src="./assets/images/beihuazaixian.png" alt="北化在线" title="北化在线">
            </a>
            <a href="http://jwglxt.buct.edu.cn/" target="_blank">
                <img src="./assets/images/jiaowuguanli.png" alt="教务系统" title="教务系统">
            </a>
            <a href="http://tree.buct.edu.cn/" target="_blank">
                <img src="./assets/images/buctTree.png" alt="校园网" title="校园网">
            </a>
            <a href="https://sjcx.buct.edu.cn/" target="_blank">
                <img src="./assets/images/chuangxinshijian.png" alt="实践教学平台" title="实践教学平台">
            </a>
        </div>
    </section>

    <!-- 模块2：计算机科学 -->
    <section id="cs">
        <h2>二、计算机科学</h2>
        <div class="link-box">
            <a href="https://www.kaggle.com/" target="_blank">
                <img src="./assets/images/kaggle.png" alt="数据科学" title="数据科学">
            </a>
            <a href="https://github.com/fmw666/Assembly" target="_blank">
                <img src="./assets/images/assembly.png" alt="汇编语言" title="汇编语言">
            </a>
            <a href="https://chat.deepseek.com/" target="_blank">
                <img src="./assets/images/ds.png" alt="deepseek" title="deepseek">
            </a>
        </div>
    </section>

    <!-- 模块3：机械工程（空白预留拓展） -->
    <section id="mech">
        <h2>三、机械工程</h2>
        <div class="link-box">
            <p>该模块持续更新中，后续可添加机械建模、仿真、机械设计等相关网站链接</p>
        </div>
    </section>

    <!-- 模块4：电子技术 -->
    <section id="elec">
        <h2>四、电子技术</h2>
        <div class="link-box">
            <a href="https://iot.10086.cn/" target="_blank">
                <img src="./assets/images/onenet.png" alt="OneNet物联网平台" title="OneNet物联网平台">
            </a>
        </div>
    </section>

    <!-- 模块5：实用技术 -->
    <section id="practical">
        <h2>五、实用技术</h2>
        <div class="link-box">
            <div class="text-link">
                <p>功能测试入口：<a href="test.html" target="_blank">测试链接</a></p>
            </div>
        </div>
    </section>
</body>
</html>
